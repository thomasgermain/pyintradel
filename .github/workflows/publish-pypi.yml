name: Publish to pypi

# The release tag is the version (hatch-vcs): publishing release "0.1.0" uploads 0.1.0.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # Required for PyPI trusted publishing (OIDC). No token/secret needed.
      id-token: write

    steps:
    # Upload exactly what the build workflow built and tested.
    - uses: actions/download-artifact@v8
      with:
        name: dist
        path: dist/

    - name: Publish package
      uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
