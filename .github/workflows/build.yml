name: Build

on:
  push:
    branches: [master]
  pull_request:
  # Called by the publish workflow, so a release is only published after these checks pass.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.13', '3.14', '3.15']

    steps:
    - uses: actions/checkout@v7
      with:
        # hatch-vcs derives the version from git tags.
        fetch-depth: 0

    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      id: sync
      run: uv sync --locked

    # Each check runs even if a previous one failed, but not when the install itself failed.
    - name: Lint with ruff
      if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
      run: uv run ruff check

    - name: Check formatting with ruff
      if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
      run: uv run ruff format --check

    - name: Type check with mypy
      if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
      run: uv run mypy

    - name: Run tests
      if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
      run: uv run pytest

  # Runs in parallel with the checks: publishing waits for this whole workflow anyway.
  package:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

    - name: Build sdist and wheel
      run: uv build

    - name: Smoke test the wheel in a clean environment
      run: uv run --isolated --no-project --with dist/*.whl pyintradel --help

    - uses: actions/upload-artifact@v7
      with:
        name: dist
        path: dist/
